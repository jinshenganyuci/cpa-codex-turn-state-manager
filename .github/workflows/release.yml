name: Build and release
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check source and registry
        run: |
          test -z "$(gofmt -l .)"
          go test -race ./...
          go vet ./...
          node --check web/app.js
          python3 scripts/check-registry.py
      - name: Browser verification
        run: |
          npm install --prefix /tmp/manager-browser playwright
          /tmp/manager-browser/node_modules/.bin/playwright install --with-deps chromium
          CPA_PLAYWRIGHT_MODULE=/tmp/manager-browser/node_modules/playwright node scripts/test-selection-ui.cjs
          CPA_PLAYWRIGHT_MODULE=/tmp/manager-browser/node_modules/playwright node scripts/test-login-ui.cjs
  build:
    needs: test
    name: Build Linux amd64
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test and build native library
        run: |
          go test ./...
          go vet ./...
          mkdir -p dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -buildmode=c-shared -ldflags '-s -w' -o dist/codex-turn-state-manager.so .
          python3 scripts/package.py linux amd64 so
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-linux-amd64
          path: |
            dist/codex-turn-state-manager_*_linux_amd64.zip
            dist/codex-turn-state-manager_*_linux_amd64.zip.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: plugin-*
          merge-multiple: true
      - name: Verify release artifacts
        run: python3 scripts/verify-release.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*_linux_amd64.zip dist/checksums.txt --verify-tag --title "回合状态管理 $GITHUB_REF_NAME" --notes-file .github/release-notes.md
